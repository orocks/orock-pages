<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>orocks — Tools & Resources</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #2a2a3a;
      --text: #e0e0e8;
      --muted: #8888a0;
      --accent: #6c8cff;
      --green: #4ade80;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    header {
      text-align: center;
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    header p {
      color: var(--muted);
      font-size: 1.05rem;
    }
    .status-badge {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.25);
      color: var(--green);
      font-size: 0.8rem;
      font-weight: 500;
    }
    .empty {
      text-align: center;
      padding: 4rem 0;
      color: var(--muted);
    }
    .empty .icon { font-size: 3rem; margin-bottom: 1rem; }
    footer {
      text-align: center;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📦 orocks</h1>
      <p>Tools, documents, demos &amp; publications</p>
      <span class="status-badge">● Online</span>
    </header>

    <div class="empty">
      <div class="icon">🚧</div>
      <p>Content coming soon</p>
      <p style="margin-top:0.5rem;font-size:0.9rem;">New pages and tools are published here over time. Check back regularly.</p>
    </div>

    <footer>
      <p>orocks/orock-pages · GitHub Pages</p>
    </footer>
  </div>
</body>
</html>
